version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk
      POSTGRES_DB: medikiosk
    ports:
      - "5432:5432"
    volumes:
      - medikiosk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikiosk -d medikiosk"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://medikiosk:medikiosk@db:5432/medikiosk
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./sample_data:/app/sample_data:ro
      - ./evaluation:/evaluation

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  medikiosk_db_data:
